services:
  - type: web
    name: drive-agent-dashboard
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /agent-ping/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DRIVE_AGENT_API_TOKEN
        generateValue: true
      - key: DRIVE_AGENT_ENABLE_LOCAL_SCANNER
        value: "False"
      - key: DRIVE_AGENT_ONLINE_SECONDS
        value: "3"
      - key: DRIVE_AGENT_DEFAULT_DRIVE
        value: "D:/"
      - key: DRIVE_AGENT_DRIVE_PRIORITY
        value: "D,C"
      - key: DRIVE_AGENT_FILE_BATCH_SIZE
        value: "250"
      - key: DRIVE_AGENT_FILE_DOWNLOAD_WAIT_SECONDS
        value: "20"
      - key: DRIVE_AGENT_AUTO_SELECT_SINGLE_ACTIVE_AGENT
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: drive-agent-db
          property: connectionString

databases:
  - name: drive-agent-db
    plan: free
